[project]
name = "marlin-clipper"
version = "0.1.0"
description = "Local web tool to find and clip moments in long videos using Marlin-2B + ffmpeg"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.11.0",
    "torchvision",
    "transformers>=5.7.0",
    "torchcodec",
    "qwen-vl-utils>=0.0.14",
    "av",
    "pillow",
    "accelerate",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1",
    "faster-whisper>=1.0",
    # ctranslate2 is built against CUDA 12 — we need cu12 cublas/cudnn alongside
    # the cu13 libs that come with torch 2.12.
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[project.scripts]
clip = "clipper.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
